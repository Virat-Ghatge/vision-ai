<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enable Vision microphone</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 480px; margin: 0 auto; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; line-height: 1.2; margin-top: 0; }
    button { padding: 10px 14px; margin: 8px 8px 0 0; border-radius: 8px; cursor: pointer; font: inherit; }
    #status { min-height: 3em; }
  </style>
</head>
<body>
  <h1>Allow microphone in Chrome</h1>
  <p>Choose <strong>Allow</strong> in Chrome's prompt. This window will close and Vision will start recording your voice.</p>
  <button id="allow" hidden>Try again</button>
  <button id="settings" hidden>Open microphone settings</button>
  <p id="status" role="status">Waiting for microphone permission…</p>
  <script type="module" src="microphone/main.js"></script>
</body>
</html>
