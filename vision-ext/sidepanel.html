<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision AI</title>
  <link rel="stylesheet" href="/panel/main.css">
  <style>
    /* Reason: only reset box-sizing here. Tailwind v4 emits all utilities in
       `@layer utilities`, and an *unlayered* `* { margin:0; padding:0 }` beats
       every layered rule regardless of specificity — silently nulling every
       p-*/m-*/space-* utility in the panel. Tailwind's own preflight (in
       @layer base) already zeroes default element margins/padding, so dropping
       them here is safe and lets spacing utilities work. */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #fff;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/panel/main.js"></script>
</body>
</html>
