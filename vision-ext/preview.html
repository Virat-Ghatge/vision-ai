<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dassi — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      padding: 16px 24px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 500;
      color: #a1a1aa;
    }

    .header .filename {
      font-size: 14px;
      font-weight: 600;
      color: #fafafa;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .header .meta {
      margin-left: auto;
      font-size: 12px;
      color: #71717a;
    }

    .download-btn {
      padding: 6px 14px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .download-btn:hover { background: #2563eb; }

    a { color: #93c5fd; }
    button, a { touch-action: manipulation; }
    button:focus-visible, a:focus-visible { outline: 2px solid #93c5fd; outline-offset: 3px; }
    .folder-navigation {
      width: 100%; padding: 20px 24px; line-height: 1.7;
      background: #18181b; border-bottom: 1px solid #27272a;
      overflow-wrap: anywhere;
    }
    .folder-location-note { color: #a1a1aa; font-size: 12px; margin-top: 4px; }
    .folder-browser { width: min(800px, 100%); margin: 0 auto; padding: 28px 24px; }
    .folder-browser h1 { font-size: 24px; overflow-wrap: anywhere; }
    .folder-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin: 18px 0; }
    .folder-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .folder-download-status { color: #a1a1aa; font-size: 13px; margin-bottom: 12px; }
    .folder-download-status:empty { display: none; }
    .folder-download-all:disabled, .folder-refresh:disabled { opacity: 0.5; cursor: default; }
    .folder-toolbar p, .folder-kind, .folder-empty { color: #a1a1aa; font-size: 14px; }
    .folder-list { list-style: none; border-top: 1px solid #27272a; }
    .folder-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-bottom: 1px solid #27272a; padding: 12px 0; }
    .folder-entry { flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 6px 0; }
    .folder-directory::before { content: '▸'; margin-right: 10px; }
    .folder-refresh, .folder-download { background: #27272a; color: #fafafa; border: 1px solid #3f3f46; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
    .folder-refresh:hover, .folder-download:hover { background: #3f3f46; }
    .folder-download:disabled { opacity: 0.5; cursor: wait; }
    .folder-download-error { width: 100%; color: #f87171; font-size: 13px; }
    .folder-download-error:empty { display: none; }
    #error { padding: 24px; overflow-wrap: anywhere; }

    #loading {
      margin-top: 40vh;
      font-size: 15px;
      color: #71717a;
    }

    #error {
      margin-top: 40vh;
      font-size: 15px;
      color: #ef4444;
      display: none;
    }

    #content {
      flex: 1;
      width: 100%;
      display: none;
      flex-direction: column;
    }

    #content.visible { display: flex; }

    .unsupported-preview {
      padding: 48px 24px;
      text-align: center;
      line-height: 1.6;
      color: #a1a1aa;
    }

    /* Image preview */
    #content img {
      max-width: 100%;
      max-height: calc(100vh - 60px);
      object-fit: contain;
      margin: 24px auto;
    }

    /* PDF / sandboxed HTML frame */
    #content iframe, #content embed {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 60px);
      border: none;
      background: #fff;
    }

    /* Text preview */
    #content pre {
      flex: 1;
      padding: 24px;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
      background: #09090b;
      color: #d4d4d8;
    }

    /* Formatted text previews */
    .text-preview { width: min(960px, 100%); margin: 0 auto; padding: 24px; min-width: 0; }
    .preview-toolbar { border: 0; min-width: 0; display: flex; gap: 4px; margin-bottom: 20px; }
    .preview-toolbar button { background: transparent; color: #a1a1aa; border: 1px solid #3f3f46; border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    .preview-toolbar button[aria-pressed=true] { background: #27272a; color: #fafafa; }
    .preview-toolbar button:disabled { opacity: 0.5; cursor: default; }
    .preview-notice { display: block; color: #a1a1aa; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
    .markdown-preview { line-height: 1.75; font-size: 15px; overflow-wrap: anywhere; }
    .markdown-preview > * + * { margin-top: 16px; }
    .markdown-preview h1, .markdown-preview h2, .markdown-preview h3, .markdown-preview h4 { color: #fafafa; line-height: 1.3; margin: 28px 0 12px; }
    .markdown-preview > :first-child { margin-top: 0; }
    .markdown-preview h1 { font-size: 30px; }
    .markdown-preview h2 { font-size: 23px; padding-bottom: 8px; border-bottom: 1px solid #27272a; }
    .markdown-preview h3 { font-size: 19px; }
    .markdown-preview ul, .markdown-preview ol { padding-left: 24px; }
    .markdown-preview li + li { margin-top: 6px; }
    .markdown-preview li > p { margin: 8px 0; }
    .markdown-preview blockquote { padding: 4px 16px; border-left: 3px solid #52525b; color: #a1a1aa; }
    .markdown-preview code { background: #27272a; border-radius: 4px; padding: 2px 5px; font-size: 0.9em; }
    #content .markdown-preview pre { padding: 16px; border: 1px solid #27272a; border-radius: 8px; white-space: pre; word-break: normal; }
    .markdown-preview pre code { background: none; padding: 0; border-radius: 0; }
    .markdown-preview hr { border: 0; border-top: 1px solid #3f3f46; }
    .preview-table { overflow-x: auto; max-width: 100%; }
    .preview-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .preview-table th, .preview-table td { border: 1px solid #3f3f46; padding: 8px 12px; text-align: left; }
    .preview-table th { background: #18181b; color: #fafafa; }
    .preview-table tr:nth-child(even) { background: #111113; }
    #content .preview-source, #content .json-preview pre { border: 1px solid #27272a; border-radius: 8px; padding: 16px; }
    #content .json-preview pre { white-space: pre; word-break: normal; }
    @media (max-width: 480px) {
      .text-preview { padding: 20px 16px; }
      .markdown-preview h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div id="loading">Loading file...</div>
  <div id="error"></div>
  <div id="content"></div>

  <script type="module" src="preview/main.js"></script>
</body>
</html>
