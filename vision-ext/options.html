<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision AI Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/options/options.css">
  <style>
    :root {
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --orange: #FF5C00;
      --orange-light: #FFF4ED;
      --black: #000000;
      --gray-900: #1A1A1A;
      --gray-700: #333333;
      --gray-600: #666666;
      --gray-500: #999999;
      --gray-300: #E5E5E5;
      --gray-200: #F0F0F0;
      --gray-100: #F8F8F8;
      --white: #FFFFFF;
      --green: #22C55E;
      --red: #CC0000;
      --blue: #4285F4;
      --anthropic: #D97757;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--gray-100);
      min-height: 100vh;
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* Reason: tier cards are emulated buttons (div role="button" tabIndex=0). They need a
       visible focus indicator for keyboard users — :focus-visible avoids showing the outline
       on mouse clicks. Color matches the selected-card border tone for visual consistency. */
    [data-tier-card]:focus-visible {
      outline: 2px solid #FF8A4D;
      outline-offset: 2px;
    }

    /* Reason: the PlanTab buttons use inline React styles, which cannot express :hover —
       these rules pair with the base styles in PlanTab.styles.ts. A brightness filter keeps
       every color single-sourced there (no hex duplicated here) and works for both the
       light-orange CTA and the solid-green WeChat button. :not(:disabled) skips the
       current-plan and in-flight (isSubscribing) states. */
    .tier-btn-cta:hover:not(:disabled) {
      filter: brightness(0.95);
    }
    .tier-btn-wechat:hover:not(:disabled) {
      filter: brightness(0.92);
    }
  </style>

  <style>
    :root {
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --orange: #F59E0B; /* Marvel Vision Solar Mind Stone Gold */
      --orange-light: rgba(245, 158, 11, 0.15);
      --black: #F8FAFC; /* Platinum text in dark synthezoid theme */
      --gray-900: #F1F5F9;
      --gray-700: #CBD5E1;
      --gray-600: #94A3B8;
      --gray-500: #64748B;
      --gray-300: #1E293B;
      --gray-200: #161F30;
      --gray-100: #0B0F19; /* Vibranium Obsidian Body */
      --white: #111827; /* Dark Slate Cards */
      --green: #10B981; /* Cybernetic Emerald */
      --red: #BE123C; /* Synthezoid Velvet Crimson */
      --blue: #38BDF8;
      --anthropic: #F59E0B;

      --gl-label: #F8FAFC !important;
      --gl-secondary: #94A3B8 !important;
      --gl-fill: #161F30 !important;
      --gl-separator: rgba(255, 255, 255, 0.08) !important;
      --gl-control-edge: rgba(245, 158, 11, 0.3) !important;
      --gl-tint: #F59E0B !important;
      --gl-focus: rgba(245, 158, 11, 0.35) !important;
    }

    body {
      background-color: #0B0F19 !important;
      color: #F8FAFC !important;
    }

    .settings-layout {
      background-color: #0B0F19 !important;
    }
    .settings-header {
      background-color: #111827 !important;
      border-bottom: 1px solid #1E293B !important;
    }
    .settings-nav {
      background-color: #0B0F19 !important;
      border-right: 1px solid #1E293B !important;
    }
    .settings-nav-item {
      color: #94A3B8 !important;
    }
    .settings-nav-item:hover {
      background-color: #161F30 !important;
      color: #F8FAFC !important;
    }
    .settings-nav-item.is-active {
      background: linear-gradient(135deg, rgba(159, 18, 57, 0.3) 0%, rgba(245, 158, 11, 0.2) 100%) !important;
      color: #FBBF24 !important;
      border-left: 3px solid #F59E0B !important;
      font-weight: 600 !important;
    }
    .settings-logo-icon {
      background: linear-gradient(135deg, #9F1239 0%, #F59E0B 100%) !important;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.4) !important;
    }
    .settings-logo-text {
      background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #E11D48 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      font-weight: 700 !important;
      font-size: 18px !important;
    }
    .settings-card, .gl-card {
      background-color: #111827 !important;
      border: 1px solid #1E293B !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }
    /* Dark theme text boxes, inputs, textareas, and select dropdowns */
    .gl-field,
    .gl-popup,
    .gl-textarea,
    input,
    select,
    textarea {
      background-color: #161F30 !important;
      color: #F8FAFC !important;
      border: 1px solid #1E293B !important;
      box-shadow: 0 0 0 1px #1E293B !important;
    }
    .gl-field::placeholder,
    .gl-textarea::placeholder,
    input::placeholder,
    textarea::placeholder,
    ::-webkit-input-placeholder,
    ::-moz-placeholder {
      color: #64748B !important;
      opacity: 1 !important;
    }
    .gl-field:focus,
    .gl-popup:focus,
    .gl-textarea:focus,
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #F59E0B !important;
      outline: 2px solid rgba(245, 158, 11, 0.3) !important;
      box-shadow: 0 0 0 1px #F59E0B, 0 0 0 4px rgba(245, 158, 11, 0.2) !important;
    }
    select option,
    .gl-popup option {
      background-color: #161F30 !important;
      color: #F8FAFC !important;
    }
    .gl-chip {
      background: #161F30 !important;
      color: #94A3B8 !important;
      border: 1px solid #1E293B !important;
    }
    .gl-chip:hover {
      background: #1E293B !important;
      color: #F8FAFC !important;
    }
    .gl-chip[aria-pressed="true"] {
      background: linear-gradient(135deg, rgba(159, 18, 57, 0.35) 0%, rgba(245, 158, 11, 0.25) 100%) !important;
      color: #FBBF24 !important;
      border-color: #F59E0B !important;
    }
    .gl-chip[aria-pressed="true"] .gl-chip-count {
      color: #FBBF24 !important;
    }
    .gl-kbd {
      background: #161F30 !important;
      color: #F8FAFC !important;
      box-shadow: 0 0 0 1px #1E293B !important;
    }
    .gl-btn {
      background: #161F30 !important;
      color: #F8FAFC !important;
      border: 1px solid #1E293B !important;
    }
    .gl-btn--prominent {
      background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%) !important;
      color: #0B0F19 !important;
      font-weight: 600 !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/options/options.js"></script>
</body>
</html>
