<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopTech Store - Vision AI Test Webpage</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 24px; color: #38bdf8; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }
    .card h3 { margin-top: 0; font-size: 16px; color: #f1f5f9; }
    .price { font-size: 18px; font-weight: bold; color: #4ade80; margin: 8px 0; }
    .log-box {
      margin-top: 32px;
      padding: 16px;
      border-radius: 8px;
      background: #020617;
      border: 1px solid #1e293b;
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ShopTech Store</h1>
    <nav>
      <a href="#laptops" style="color:#94a3b8; margin-right: 12px;">Laptops</a>
      <a href="#phones" style="color:#94a3b8; margin-right: 12px;">Phones</a>
      <button id="cart-btn" aria-label="Shopping Cart">Cart (0)</button>
    </nav>
  </div>

  <form id="search-form" class="search-bar" onsubmit="event.preventDefault(); logAction('SEARCH_SUBMITTED: ' + document.getElementById('search-input').value);">
    <input type="text" id="search-input" placeholder="Search laptops, phones, accessories..." />
    <button type="submit" id="search-btn">Search</button>
  </form>

  <div class="grid">
    <div class="card">
      <h3>MacBook Pro M4 16"</h3>
      <div class="price">$2,499.00</div>
      <button id="buy-macbook" onclick="logAction('CLICKED: Buy MacBook Pro M4')">Buy Now</button>
    </div>
    <div class="card">
      <h3>Dell XPS 15 OLED</h3>
      <div class="price">$1,899.00</div>
      <button id="buy-dell" onclick="logAction('CLICKED: Buy Dell XPS 15')">Buy Now</button>
    </div>
    <div class="card">
      <h3>Sony WH-1000XM5</h3>
      <div class="price">$399.00</div>
      <button id="buy-sony" onclick="logAction('CLICKED: Buy Sony WH-1000XM5')">Buy Now</button>
    </div>
  </div>

  <div class="log-box" id="event-log">
    [Event Log Ready - Waiting for actions...]
  </div>

  <script>
    function logAction(msg) {
      const el = document.getElementById('event-log');
      el.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' - ' + msg;
      el.scrollTop = el.scrollHeight;
    }
  </script>
</body>
</html>
